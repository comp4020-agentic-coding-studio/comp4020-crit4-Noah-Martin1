<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instrument Kit</title>
    <meta
      name="description"
      content="Six instruments in one tuning — harp, bass, marimba, blocks, drums, bells. Pick one up, play it, and layer a loop. Every note is synthesised live in the browser."
    />

    <!-- The link-preview card. It resolves against this page, like any link. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="Four instruments you can pick up and play"></canvas>

    <div class="chrome chrome--top-left">
      <h1>Instrument Kit</h1>
      <span id="now-playing" class="now-playing"></span>
    </div>

    <div class="chrome chrome--top-right">
      <button id="back" type="button" class="back">&larr; all instruments</button>
      <button id="mute" type="button" aria-pressed="false">sound on</button>
    </div>

    <div id="invitation">
      <p>Pick up an instrument</p>
      <small>or hear the example beat &mdash; six instruments, one tuning</small>
    </div>

    <div id="transport" class="transport" data-state="idle">
      <button id="demo" type="button" class="demo">&#9654; example beat</button>
      <button id="record" type="button" aria-pressed="false" class="record">record</button>
      <button id="play" type="button" aria-pressed="false">play</button>
      <button id="clear" type="button">clear</button>
      <p class="legend">
        <kbd>space</kbd> record &middot; <kbd>1</kbd>&ndash;<kbd>6</kbd> pick &middot;
        <kbd>esc</kbd> back &middot; <kbd>0</kbd> mute
      </p>
    </div>

    <div class="chrome chrome--bottom-right">
      <nav aria-label="Primary">
        <a class="archive-link" href="./archive/osmos/open-field.html">
          Earlier work: the orb garden
        </a>
      </nav>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
